name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  docs:
      uses: ./.github/workflows/docs.yml

  tests:
    uses: ./.github/workflows/tests.yml

  browser-tests:
    uses: ./.github/workflows/browser-tests.yml
  
  build-cli:
    needs:
      - tests
    uses: ./.github/workflows/cli.yml

  build-node:
    needs:
      - tests
    uses: ./.github/workflows/node.yml

  build-extension:
    needs:
      - tests
    uses: ./.github/workflows/extensions.yml