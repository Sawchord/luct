[package]
name = "luct-extension"
description = "Core types and parsers for certificate transparency"
edition = { workspace = true }
authors = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
version = { workspace = true }
readme = { workspace = true }
publish = { workspace = true }
categories = { workspace = true }
keywords = { workspace = true }
license = { workspace = true }

[lib]
crate-type = ["cdylib"]

[dependencies]
luct-core = { version = "0.2.2", path = "../luct-core" }
luct-client = { version = "0.2.2", path = "../luct-client" }
luct-otlsp = { version = "0.2.2", path = "../luct-otlsp" }
luct-scanner = { version = "0.2.2", path = "../luct-scanner" }
luct-store = { version = "0.2.2", path = "../luct-store" }

serde = { workspace = true }
serde_json = { workspace = true }
serde-wasm-bindgen = { workspace = true }

url = { workspace = true }
chrono = { workspace = true }

futures = { workspace = true }

web-sys = { workspace = true, features = [
    'Document',
    'Element',
    'HtmlElement',
    'Node',
    'Storage',
    'Window',
] }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
console_error_panic_hook = { workspace = true }
web-time = { workspace = true }
js-sys = { workspace = true }

# This needs to be imported here to set the "js" feature,
# otherwise the crate would not compile to wasm
getrandom = { version = "0.4", features = ["wasm_js"] }
old_getrandom = { package = "getrandom", version = "0.2", features = ["js"] }

tracing = { workspace = true }
tracing-wasm = { workspace = true }

[dev-dependencies]
luct-test = { version = "0.2.2", path = "../luct-test" }

tracing-subscriber = { workspace = true }
wasm-bindgen-test = { workspace = true }
